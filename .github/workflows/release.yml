name: Release

# main 브랜치에 커밋(푸시)되면 자동으로 빌드해서 GitHub Release로 배포합니다.
on:
  push:
    branches:
      - main
  workflow_dispatch: # 필요하면 수동으로도 실행 가능

# Release 생성/수정을 위해 쓰기 권한이 필요합니다.
permissions:
  contents: write

# 같은 브랜치에서 연속 커밋 시 이전 실행을 취소하고 최신 것만 배포합니다.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # AchDevTool.csproj 의 <Version> 값을 읽어서 릴리스 태그로 사용합니다.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/AchDevTool/AchDevTool.csproj | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            script: "./build/build-macos.sh arm64"
            # actions/upload-artifact and softprops/action-gh-release both accept a
            # newline-separated list of globs here (NOT comma-separated).
            artifacts: |
              releases/osx-arm64/*.dmg
              releases/osx-arm64/*-Portable.zip
          - platform: windows-latest
            script: "pwsh ./build/build-windows.ps1"
            artifacts: |
              releases/win-x64/*Setup.exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build installer
        shell: bash
        run: ${{ matrix.script }}

      # GitHub Release 업로드가 저장소 권한 설정 때문에 실패하더라도(Settings → Actions →
      # General → Workflow permissions 가 read-only인 경우) 이 아티팩트로 바로 받을 수 있습니다.
      - name: Upload build artifact (fallback download)
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ needs.prepare.outputs.version }}
          name: "AchDev Tool v${{ needs.prepare.outputs.version }}"
          body: "자동 빌드된 설치 파일입니다. 아래 Assets에서 OS에 맞는 파일을 받으세요."
          draft: false
          prerelease: false
          files: ${{ matrix.artifacts }}
