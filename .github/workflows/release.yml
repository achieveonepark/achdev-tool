name: Release

# main 브랜치에 커밋(푸시)되면 자동으로 빌드해서 GitHub Release로 배포합니다.
on:
  push:
    branches:
      - main
  workflow_dispatch: # 필요하면 수동으로도 실행 가능

# Release 생성/수정을 위해 쓰기 권한이 필요합니다.
permissions:
  contents: write

# 같은 브랜치에서 연속 커밋 시 이전 실행을 취소하고 최신 것만 배포합니다.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # AchDevTool.csproj 의 <Version> 값을 읽어서 릴리스 태그로 사용합니다.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_exists: ${{ steps.existing.outputs.release_exists }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        shell: bash
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/AchDevTool/AchDevTool.csproj | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=app-v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      # 이미 게시된 릴리스는 건드리지 않습니다.
      # (게시된 릴리스를 수정하려 하면 GITHUB_TOKEN 에 contents:write 가 있어도
      #  "Resource not accessible by integration" 403 으로 거부될 수 있습니다.
      #  새 버전을 배포하려면 csproj 의 <Version> 을 올리세요.)
      - id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::릴리스 $TAG 가 이미 존재하므로 배포 단계를 건너뜁니다. 새로 배포하려면 src/AchDevTool/AchDevTool.csproj 의 <Version> 을 올리세요."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

  # 설치 파일을 만들어 워크플로 아티팩트로 올립니다.
  # 배포(Release 업로드)와 분리해 두었기 때문에, 배포가 막혀 있어도 빌드 결과물은 항상 받을 수 있습니다.
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            script: "./build/build-macos.sh arm64"
            # actions/upload-artifact 는 줄바꿈으로 구분된 glob 목록을 받습니다(콤마 아님).
            artifacts: |
              releases/osx-arm64/*.dmg
              releases/osx-arm64/*-Portable.zip
          - platform: windows-latest
            script: "pwsh ./build/build-windows.ps1"
            artifacts: |
              releases/win-x64/*Setup.exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # macOS 서명/공증용 값입니다. 비어 있으면 지금까지처럼 서명 없이 빌드합니다.
      # (CI에서 실제로 서명하려면 인증서를 러너 키체인에 먼저 import 해야 합니다.)
      - name: Build installer
        shell: bash
        env:
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          MAC_INSTALL_IDENTITY: ${{ secrets.MAC_INSTALL_IDENTITY }}
          MAC_NOTARY_PROFILE: ${{ secrets.MAC_NOTARY_PROFILE }}
        run: ${{ matrix.script }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  # 양쪽 빌드가 끝난 뒤 한 번만 실행해서 릴리스를 만듭니다.
  # (예전처럼 두 빌드 잡이 각자 같은 릴리스를 동시에 수정하지 않도록 분리했습니다.)
  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.release_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installer-*
          merge-multiple: true

      - name: List files to publish
        shell: bash
        run: ls -lR dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "AchDev Tool v${{ needs.prepare.outputs.version }}"
          body: "자동 빌드된 설치 파일입니다. 아래 Assets에서 OS에 맞는 파일을 받으세요."
          draft: false
          prerelease: false
          files: dist/*
          fail_on_unmatched_files: true
